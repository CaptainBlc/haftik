name: CI

# Amac: her push/PR'da tip kontrolu + lint + test + expo-doctor calistir. Ucretsiz
# GitHub Actions dakikalari yeterli olacak sekilde tek job, tek Node surumu, cache
# acik. Node surumu .nvmrc'den okunur (bkz. docs/kararlar/2026-10-01-taban-oncesi-
# kararlar-b.md A2) - iki yerde ayri ayri yazmaktan kacinilir.
# permissions en dar kapsamda tutulur (varsayilan GITHUB_TOKEN genis yetkiyle gelir).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, lint, test, doctor
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Bagimliliklari kur
        run: npm ci

      - name: Tip kontrolu (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testler (Jest)
        run: npm test -- --ci

      - name: Expo saglik kontrolu (expo-doctor)
        run: npx expo-doctor

      # 26-yayin-plani-v2.md D3: surum = CHANGELOG ust basligi, kimlik kilidi, eas.json autoIncrement,
      # repoda anahtar/derleme dosyasi yok. Hizli, agsiz; her push/PR'da.
      - name: Surum ve kimlik kapisi (check-release)
        run: node scripts/check-release.js

      # Yalnizca etiket (v*) push'unda: etiket = v+surum, yer tutucu sozcukler (0.2.0 ve sonrasi KIRMIZI),
      # npm audit (kabul edilmemis high/critical = 0; kabul listesi scripts/audit-accepted.json),
      # uretim paketinde dev menu/fikstur dizeleri 0 (pozitif kontrollu).
      - name: Etiket kapisi (check-release --audit --bundle)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-release.js --audit --bundle
