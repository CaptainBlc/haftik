      <rect width="24" height="24" fill="#000"/>
      <g transform="rotate(-6 12 12)">
        <rect x="3" y="3" width="18" height="18" rx="5" fill="#FFF"/>
        <path d="M434 340V668M434 548C434 480 474 456 512 456C552 456 590 480 590 548V668" transform="translate(12 12) scale(.0272) translate(-512 -504)"
