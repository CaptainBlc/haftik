<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24">
  <!-- Bildirim küçük ikonu (Android durum çubuğu): yalnız beyaz + saydamlık, 24 dp, içerik ~19 dp (2 dp pay).
